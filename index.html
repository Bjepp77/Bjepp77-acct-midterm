<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Managerial Accounting — Exam 1 Practice</title>
<style>
:root{
  --bg:#faf8f5; --panel:#ffffff; --ink:#1c1b19; --muted:#6b6660;
  --line:#e2ddd6; --accent:#2f5d50; --accent-ink:#ffffff;
  --ok:#1f6f43; --ok-bg:#e6f3ea; --bad:#9c2a2a; --bad-bg:#fbeaea;
  --code:#f1ede7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --panel:#1d2024; --ink:#e8e6e3; --muted:#9a948c;
    --line:#2e3238; --accent:#6fae9a; --accent-ink:#10231d;
    --ok:#7ec89b; --ok-bg:#16291f; --bad:#e08a8a; --bad-bg:#2a1818;
    --code:#23272c;
  }
}
:root[data-theme="dark"]{
  --bg:#15171a; --panel:#1d2024; --ink:#e8e6e3; --muted:#9a948c;
  --line:#2e3238; --accent:#6fae9a; --accent-ink:#10231d;
  --ok:#7ec89b; --ok-bg:#16291f; --bad:#e08a8a; --bad-bg:#2a1818;
  --code:#23272c;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:24px 16px 80px;
}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:1.3rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.86rem;margin:0 0 18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{
  font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);
  color:var(--ink);border-radius:8px;padding:8px 12px;
}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button[disabled]{cursor:default;opacity:.65}
select,input[type=text]{
  font:inherit;background:var(--panel);color:var(--ink);
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;
}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.badge{font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.stem{font-size:1.02rem;margin:0 0 14px;white-space:pre-wrap}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;white-space:pre-wrap}
.choice .key{font-weight:600;color:var(--muted);flex:0 0 1.2em}
.choice.correct{background:var(--ok-bg);border-color:var(--ok);color:var(--ink)}
.choice.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--ink)}
.verdict{font-weight:600;margin:14px 0 6px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.sol{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.sol h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
.sol ol{margin:0 0 10px;padding-left:1.3em}
.sol li{margin-bottom:5px}
.sol table{border-collapse:collapse;width:100%;margin:10px 0;font-size:.92rem}
.sol th,.sol td{border:1px solid var(--line);padding:6px 9px;text-align:left}
.sol th{background:var(--code);font-weight:600}
.sol td.num,.sol th.num{text-align:right;font-variant-numeric:tabular-nums}
code,.formula{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  background:var(--code);border-radius:4px;padding:1px 5px;font-size:.92em}
.formula{display:block;padding:9px 11px;margin:8px 0;white-space:pre-wrap}
.src{color:var(--muted);font-size:.78rem;margin-top:10px}
table.stats{border-collapse:collapse;width:100%;font-size:.9rem}
table.stats th,table.stats td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
table.stats td.num,table.stats th.num{text-align:right;font-variant-numeric:tabular-nums}
.warn{background:var(--bad-bg);border:1px solid var(--bad);border-radius:8px;padding:12px;margin-bottom:14px}
.hint{color:var(--muted);font-size:.84rem}
.answerline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>Managerial Accounting — Exam 1 Practice</h1>
  <p class="sub" id="meta">Loading question bank…</p>

  <div id="loaderr" class="warn" hidden>
    <strong>Question bank did not load.</strong>
    <div class="hint" style="margin-top:6px">
      Opening the file directly blocks <code>fetch</code>. Either run
      <code>./build.sh</code> once (writes <code>questions.js</code>), or serve the folder:
      <code>python3 -m http.server 8777</code> then open <code>http://localhost:8777/</code>
    </div>
  </div>

  <div class="panel" id="controls" hidden>
    <div class="row">
      <label for="topic">Topic</label>
      <select id="topic"></select>
      <label for="mode">Mode</label>
      <select id="mode">
        <option value="all">All questions</option>
        <option value="missed">Missed only</option>
        <option value="unseen">Not yet seen</option>
      </select>
      <button id="start" class="primary">Start</button>
      <button id="reset">Reset progress</button>
    </div>
    <div class="hint" id="poolinfo" style="margin-top:8px"></div>
  </div>

  <div class="panel" id="card" hidden></div>

  <div class="panel" id="stats" hidden></div>
</div>

<script>
/* ---------- storage (never trust it; it can throw or come back empty) ---------- */
var KEY = "acct-midterm-progress-v1";
function loadProg(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return {};
    var o = JSON.parse(raw);
    return (o && typeof o === "object") ? o : {};
  }catch(e){ return {}; }
}
function saveProg(p){ try{ localStorage.setItem(KEY, JSON.stringify(p)); }catch(e){} }
var prog = loadProg();   // id -> {seen, right, wrong, streak}

function rec(id){
  if(!prog[id]) prog[id] = {seen:0,right:0,wrong:0,streak:0};
  return prog[id];
}

/* ---------- bank loading: fetch first, questions.js fallback for file:// ---------- */
var BANK = null;

function boot(bank){
  if(!bank || !bank.questions || !bank.questions.length){ showLoadError(); return; }
  BANK = bank;
  document.getElementById("meta").textContent = bankLine(bank);
  buildTopics();
  document.getElementById("controls").hidden = false;
  renderStats();
  updatePoolInfo();
}
function showLoadError(){
  document.getElementById("loaderr").hidden = false;
  document.getElementById("meta").textContent = "";
}
function bankLine(b){
  var m = b.meta || {};
  var bits = [];
  if(m.exam) bits.push(m.exam);
  if(m.window) bits.push(m.window);
  bits.push(b.questions.length + " questions");
  if(m.format) bits.push(m.format);
  return bits.join("  ·  ");
}
(function loadBank(){
  var done = false;
  function tryScript(){
    if(done) return;
    var s = document.createElement("script");
    s.src = "questions.js";
    s.onload = function(){ done = true; boot(window.QUESTIONS); };
    s.onerror = function(){ done = true; showLoadError(); };
    document.head.appendChild(s);
  }
  try{
    fetch("questions.json", {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(j){ done = true; boot(j); })
      .catch(tryScript);
  }catch(e){ tryScript(); }
})();

/* ---------- pool / session ---------- */
var queue = [], current = null, answered = false;

function allTopics(){
  var seen = {}, out = [];
  BANK.questions.forEach(function(q){ if(!seen[q.topic]){ seen[q.topic]=1; out.push(q.topic); } });
  out.sort();
  return out;
}
function buildTopics(){
  var sel = document.getElementById("topic");
  sel.innerHTML = "";
  var o = document.createElement("option"); o.value="*"; o.textContent="All topics"; sel.appendChild(o);
  allTopics().forEach(function(t){
    var e = document.createElement("option"); e.value=t; e.textContent=t; sel.appendChild(e);
  });
}
function pool(){
  var t = document.getElementById("topic").value;
  var m = document.getElementById("mode").value;
  return BANK.questions.filter(function(q){
    if(t !== "*" && q.topic !== t) return false;
    var r = prog[q.id];
    if(m === "missed") return !!r && r.wrong > 0 && r.streak < 2;
    if(m === "unseen") return !r || r.seen === 0;
    return true;
  });
}
function updatePoolInfo(){
  if(!BANK) return;
  var n = pool().length;
  document.getElementById("poolinfo").textContent =
    n + (n === 1 ? " question" : " questions") + " in this pool." +
    (n === 0 ? " Change the topic or mode." : "");
}
["topic","mode"].forEach(function(id){
  document.getElementById(id).addEventListener("change", updatePoolInfo);
});

function shuffle(a){
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
/* Missed questions come back: each wrong answer re-inserts the question later in the queue. */
function startSession(){
  queue = shuffle(pool().slice());
  if(!queue.length){ updatePoolInfo(); return; }
  nextQuestion();
}
document.getElementById("start").addEventListener("click", startSession);
document.getElementById("reset").addEventListener("click", function(){
  prog = {}; saveProg(prog); queue = []; current = null;
  document.getElementById("card").hidden = true;
  renderStats(); updatePoolInfo();
});

function nextQuestion(){
  if(!queue.length){ finish(); return; }
  current = queue.shift();
  answered = false;
  renderCard();
}
function finish(){
  current = null;
  var c = document.getElementById("card");
  c.hidden = false;
  c.innerHTML = "<p class='verdict ok'>Pool finished.</p>" +
    "<p class='hint'>Switch mode to <strong>Missed only</strong> to drill what you got wrong, " +
    "or pick another topic above.</p>";
  renderStats();
  updatePoolInfo();
}

/* ---------- rendering ---------- */
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function renderCard(){
  var q = current, c = document.getElementById("card");
  c.hidden = false;
  var h = "<div class='badges'>" +
    "<span class='badge'>" + esc(q.topic) + "</span>" +
    (q.session ? "<span class='badge'>Session " + esc(q.session) + "</span>" : "") +
    (q.style ? "<span class='badge'>" + esc(q.style) + "</span>" : "") +
    "<span class='badge'>" + queue.length + " left</span>" +
    "</div>";
  h += "<p class='stem'>" + esc(q.stem) + "</p>";
  if(q.table) h += q.table;           // trusted: authored in questions.json, not user input
  if(q.type === "mc"){
    h += "<div class='choices' id='choices'>";
    q.choices.forEach(function(ch,i){
      h += "<button class='choice' data-i='" + i + "'><span class='key'>" +
           "ABCDEFGH".charAt(i) + ".</span><span>" + esc(ch) + "</span></button>";
    });
    h += "</div>";
  } else {
    h += "<div class='answerline'>" +
         "<input type='text' id='numin' inputmode='decimal' placeholder='" +
         (q.type === "numeric" ? "your number" : "your answer") + "' size='18'>" +
         "<button class='primary' id='submit'>Submit</button>" +
         "</div>";
    if(q.type === "numeric") h += "<div class='hint' style='margin-top:6px'>Digits only is fine. $ and , are ignored.</div>";
    if(q.type === "short") h += "<div class='hint' style='margin-top:6px'>Write your answer, then compare it against the model answer.</div>";
  }
  h += "<div id='after'></div>";
  c.innerHTML = h;

  if(q.type === "mc"){
    Array.prototype.forEach.call(c.querySelectorAll(".choice"), function(b){
      b.addEventListener("click", function(){ answerMC(parseInt(b.getAttribute("data-i"),10)); });
    });
  } else {
    var inp = document.getElementById("numin");
    document.getElementById("submit").addEventListener("click", answerTyped);
    inp.addEventListener("keydown", function(e){ if(e.key === "Enter") answerTyped(); });
    inp.focus();
  }
}

function parseNum(s){
  var t = String(s).replace(/[$,\s%]/g,"");
  if(t === "" ) return NaN;
  return parseFloat(t);
}
function answerMC(i){
  if(answered) return;
  answered = true;
  var q = current, ok = (i === q.answer);
  Array.prototype.forEach.call(document.querySelectorAll(".choice"), function(b){
    var bi = parseInt(b.getAttribute("data-i"),10);
    b.disabled = true;
    if(bi === q.answer) b.classList.add("correct");
    else if(bi === i) b.classList.add("wrong");
  });
  score(ok);
  showSolution(ok, null);
}
function answerTyped(){
  if(answered) return;
  var q = current, raw = document.getElementById("numin").value;
  if(q.type === "numeric"){
    var v = parseNum(raw);
    if(isNaN(v)){ return; }
    answered = true;
    var tol = (typeof q.tolerance === "number") ? q.tolerance : 0.01;
    var ok = Math.abs(v - q.answer) <= Math.max(tol, Math.abs(q.answer) * 0.001);
    score(ok);
    showSolution(ok, raw);
  } else {
    answered = true;
    score(null);                      // short answer: self-graded, see below
    showSolution(null, raw);
  }
  document.getElementById("numin").disabled = true;
  document.getElementById("submit").disabled = true;
}

function score(ok){
  var r = rec(current.id);
  r.seen++;
  if(ok === true){ r.right++; r.streak = (r.streak||0)+1; }
  else if(ok === false){ r.wrong++; r.streak = 0; }
  saveProg(prog);
}

function showSolution(ok, typed){
  var q = current, a = document.getElementById("after"), h = "";
  if(ok === true)  h += "<p class='verdict ok'>Correct.</p>";
  if(ok === false) h += "<p class='verdict bad'>Wrong." +
      (q.type === "numeric" ? " Answer: " + esc(q.answerLabel || q.answer) : "") + "</p>";
  if(ok === null)  h += "<p class='verdict'>Model answer below. Mark yourself.</p>";

  h += "<div class='sol'><h3>Worked solution</h3>" + q.solution + "</div>";
  if(q.source) h += "<p class='src'>Source: " + esc(q.source) + "</p>";

  if(ok === null){
    h += "<div class='row' style='margin-top:12px'>" +
         "<button id='selfok'>I had it</button>" +
         "<button id='selfbad'>I missed it</button></div>";
  } else {
    h += "<div class='row' style='margin-top:14px'><button class='primary' id='next'>Next</button></div>";
  }
  a.innerHTML = h;

  if(ok === false) queue.splice(Math.min(3, queue.length), 0, q);   // re-ask it soon
  if(ok === null){
    document.getElementById("selfok").addEventListener("click", function(){
      var r = rec(q.id); r.right++; r.streak = (r.streak||0)+1; saveProg(prog); nextQuestion();
    });
    document.getElementById("selfbad").addEventListener("click", function(){
      var r = rec(q.id); r.wrong++; r.streak = 0; saveProg(prog);
      queue.splice(Math.min(3, queue.length), 0, q);
      nextQuestion();
    });
  } else {
    document.getElementById("next").addEventListener("click", nextQuestion);
  }
  renderStats();
}

function renderStats(){
  if(!BANK) return;
  var s = document.getElementById("stats");
  var byTopic = {}, tot = {seen:0,right:0,wrong:0};
  BANK.questions.forEach(function(q){
    var r = prog[q.id];
    if(!byTopic[q.topic]) byTopic[q.topic] = {n:0,seen:0,right:0,wrong:0};
    byTopic[q.topic].n++;
    if(r){
      byTopic[q.topic].seen += r.seen; byTopic[q.topic].right += r.right; byTopic[q.topic].wrong += r.wrong;
      tot.seen += r.seen; tot.right += r.right; tot.wrong += r.wrong;
    }
  });
  if(tot.seen === 0){ s.hidden = true; return; }
  s.hidden = false;
  var rows = Object.keys(byTopic).sort().filter(function(t){ return byTopic[t].seen > 0; }).map(function(t){
    var b = byTopic[t], att = b.right + b.wrong;
    var pct = att ? Math.round(100 * b.right / att) : 0;
    return "<tr><td>" + esc(t) + "</td><td class='num'>" + b.n + "</td><td class='num'>" +
           att + "</td><td class='num'>" + b.wrong + "</td><td class='num'>" + pct + "%</td></tr>";
  }).join("");
  var att = tot.right + tot.wrong;
  s.innerHTML = "<h3 style='font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px'>Progress</h3>" +
    "<table class='stats'><thead><tr><th>Topic</th><th class='num'>In bank</th>" +
    "<th class='num'>Attempts</th><th class='num'>Misses</th><th class='num'>Accuracy</th></tr></thead>" +
    "<tbody>" + rows + "</tbody>" +
    "<tfoot><tr><th>Total</th><th class='num'>" + BANK.questions.length + "</th><th class='num'>" + att +
    "</th><th class='num'>" + tot.wrong + "</th><th class='num'>" +
    (att ? Math.round(100*tot.right/att) : 0) + "%</th></tr></tfoot></table>";
}
</script>
</body>
</html>
